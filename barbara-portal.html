<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>GeneThrive — Barbara's Portal (Prototype)</title>
<style>
  :root {
    --navy: #0f2238;
    --navy2: #1a3a5c;
    --green: #22543d;
    --greenbg: #f0fff4;
    --greenborder: #38a169;
    --amber: #92400e;
    --amberbg: #fffbeb;
    --amberborder: #d69e2e;
    --grey: #5b6b7d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f6;
    color: #1a202c;
  }
  header.top {
    background: var(--navy);
    color: #fff;
    padding: 14px 20px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  header.top .brand { font-size: 20px; font-weight: 700; }
  header.top .sub { font-size: 12px; color: #cdd9e5; }
  main { max-width: 900px; margin: 0 auto; padding: 20px; }

  /* ---- Login screen ---- */
  #login-screen {
    max-width: 360px;
    margin: 60px auto;
    background: #fff;
    border-radius: 8px;
    padding: 32px 36px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    text-align: center;
  }
  #login-screen .title { font-size: 22px; font-weight: 700; color: var(--navy); }
  #login-screen .sub { font-size: 13px; font-weight: 600; color: var(--navy2); margin-top: 2px; }
  #login-screen .hint { font-size: 12px; color: #555; margin: 8px 0 16px; }
  #login-pin {
    font-size: 18px; letter-spacing: 6px; text-align: center;
    padding: 8px 10px; width: 170px; border: 1px solid #b8c8d8; border-radius: 4px;
  }
  #login-screen button {
    margin-top: 16px; font-size: 13px; font-weight: 700; padding: 9px 26px;
    background: var(--navy2); color: #fff; border: none; border-radius: 4px; cursor: pointer;
  }
  #login-error {
    display: none; font-size: 12px; font-weight: 700; color: #c00; margin-top: 14px;
  }
  #login-screen .note {
    font-size: 10px; color: #8a97a3; margin-top: 14px; line-height: 1.4;
  }

  /* ---- Dashboard ---- */
  #dashboard { display: none; }
  #session-banner {
    background: #11324f; color: #dce8f5; font-size: 12px; font-weight: 600;
    padding: 6px 14px; text-align: center;
  }
  .client-card {
    background: #fff; border: 1px solid #d7dee6; border-radius: 8px;
    padding: 16px 18px; margin-bottom: 14px;
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px;
  }
  .client-card .id-block .name { font-size: 16px; font-weight: 700; color: var(--navy); }
  .client-card .id-block .code { font-size: 12px; color: var(--grey); }
  .status-pills { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .pill {
    font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px;
    border: 1px solid transparent;
  }
  .pill.ready { background: var(--greenbg); color: var(--green); border-color: var(--greenborder); }
  .pill.pending { background: #f7f7f8; color: #6b7280; border-color: #d1d5db; }
  .btn-open {
    background: var(--greenborder); color: #fff; border: none; border-radius: 5px;
    padding: 10px 18px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .btn-open:hover { opacity: 0.9; }
  .btn-open:disabled { background: #cbd5e0; cursor: not-allowed; }
  .waiting-note { font-size: 12px; color: var(--grey); font-style: italic; }
  .fetch-note {
    font-size: 11.5px; color: var(--grey); background: #fff; border: 1px dashed #c9d2db;
    border-radius: 6px; padding: 8px 12px; margin-bottom: 16px;
  }
  #handoff-log {
    font-size: 11.5px; color: var(--grey); background: #fff; border: 1px solid #d7dee6;
    border-radius: 6px; padding: 10px 12px; margin-top: 18px; white-space: pre-wrap; display: none;
  }
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand">GeneThrive</div>
    <div class="sub">Practitioner Portal — prototype</div>
  </div>
  <div class="sub">Naturopath dashboard</div>
</header>

<div id="login-screen">
  <div class="title">GeneThrive</div>
  <div class="sub">Practitioner Portal</div>
  <div class="hint">Enter your PIN to begin</div>
  <input type="password" id="login-pin" maxlength="6" autocomplete="off"
         onkeydown="if(event.key==='Enter'){portalLogin();}" />
  <div><button type="button" id="login-btn" onclick="portalLogin()">Login</button></div>
  <div id="login-error">Incorrect PIN. Access denied.</div>
</div>

<div id="dashboard">
  <div id="session-banner"></div>
  <main>
    <h2 style="color:var(--navy); margin-top:0;">Clients</h2>
    <div class="fetch-note" id="source-note">Loading client list…</div>
    <div id="client-list"></div>
    <div id="handoff-log"></div>
  </main>
</div>

<script>
/* =====================================================================
   GeneThrive — Barbara's Portal
   ---------------------------------------------------------------------
   Supabase-backed practitioner dashboard. Authenticates via server-side
   PIN check (authenticate-practitioner.js), loads clients from
   list-clients.js, and fetches full records from get-client-full-record.js.
   Falls back to client-side PIN check with an offline warning banner if
   the server is unreachable.

   HANDOFF MECHANISM TO THE ENGINE — chosen deliberately, see README:
   a one-time localStorage key, not window.postMessage. Reason: this is
   a static-file prototype that may be opened either via file:// or via
   a bare local http server, and there is no reliable moment at which
   the newly-opened Engine tab is guaranteed ready to RECEIVE a
   postMessage (no ack channel exists yet, and file:// pages frequently
   report a null/opaque origin, which breaks strict origin checks on
   both ends). A localStorage key that the Engine reads once for itself
   on load, keyed by a URL flag, needs no handshake and no origin
   assumption beyond "same origin" — true for both this file:// folder
   and the local server. The key is short-lived (5 minutes) and is
   deleted the instant either side reads it, so it behaves like a
   real one-time token even though nothing enforces that server-side
   in this prototype.
   ===================================================================== */

const API_BASE = "";                 // same-origin Netlify Functions (list-clients, get-client-full-record), when deployed/running locally
// [29 Sep 2026] Was "GeneThrive_Engine_v3.5.147_WITH_PortalHandoff.html" — a
// separate, older Engine copy that never received Barbara's later dose
// corrections or the Accept/Reject persistence wiring. The Portal Handoff
// patch (ENGINE_PATCH_PortalHandoff.md) is now merged into the one current,
// canonical Engine file instead, so there is only ever one Engine file to
// keep up to date, not two forks that can silently drift apart.
const ENGINE_FILE = "GeneThrive_Engine_v3.5.147.html"; // must sit next to this file
// PIN authentication is server-side only (authenticate-practitioner Netlify function).
// No PIN hash is stored in this file.
const HANDOFF_KEY = "gt_portal_handoff";

let _sessionToken = null;       // returned by authenticate-practitioner.js
let _practitionerName = "Barbara Baldwin"; // populated from server response

// Build fetch options with the session token header (when available).
// Falls through gracefully when REQUIRE_PRACTITIONER_TOKEN is not yet set on the server.
function authHeaders() {
  return _sessionToken ? { "X-Practitioner-Token": _sessionToken } : {};
}

async function portalLogin() {
  const inp = document.getElementById("login-pin");
  const err = document.getElementById("login-error");
  const btn = document.getElementById("login-btn");
  const pin = inp ? inp.value.trim() : "";
  if (!pin) return;

  // Disable button to prevent double-clicks during the network round-trip
  if (btn) btn.disabled = true;

  try {
    const res = await fetch(API_BASE + "/.netlify/functions/authenticate-practitioner", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pin })
    });
    const data = await res.json();

    if (data.ok) {
      _sessionToken = data.token || null;
      if (data.practitionerId) {
        // Use practitioner name from env-backed registry if returned; fall back to default
        _practitionerName = data.name || _practitionerName;
      }
      err.style.display = "none";
      document.getElementById("login-screen").style.display = "none";
      document.getElementById("dashboard").style.display = "block";
      const d = new Date().toLocaleDateString("en-AU", { day: "2-digit", month: "long", year: "numeric" });
      document.getElementById("session-banner").textContent =
        "Session: " + _practitionerName + " — ATMS 24298   |   " + d;
      loadClients();
    } else {
      // Wrong PIN or server error — reject login.
      err.style.display = "block";
      if (inp) inp.value = "";
    }
  } catch (e) {
    // Network error — Netlify function unreachable.
    console.error("authenticate-practitioner network error:", e.message);
    err.textContent = "Login service unavailable — check your connection and try again.";
    err.style.display = "block";
    if (inp) inp.value = "";
  } finally {
    if (btn) btn.disabled = false;
  }
}

async function loadClients() {
  const note = document.getElementById("source-note");
  let clients;
  try {
    const r = await fetch(API_BASE + "/.netlify/functions/list-clients", { headers: authHeaders() });
    if (!r.ok) throw new Error("server responded " + r.status);
    clients = await r.json();
    note.textContent = "Live from the unified GeneThrive backend (/.netlify/functions/list-clients).";
  } catch (e) {
    note.textContent = "Backend not reachable — check your Netlify functions are deployed and environment variables are set.";
    renderClients([]);
    return;
  }
  renderClients(clients);
}

function renderClients(clients) {
  const list = document.getElementById("client-list");
  list.innerHTML = "";
  clients.forEach(function (c) {
    const ready = c.dnaReady && c.healthProfileReady;
    const card = document.createElement("div");
    card.className = "client-card";
    card.innerHTML =
      '<div class="id-block">' +
        '<div class="name">' + escapeHtml(c.name) + '</div>' +
        '<div class="code">' + escapeHtml(c.clientId) + '</div>' +
        '<div class="status-pills">' +
          '<span class="pill ' + (c.dnaReady ? "ready" : "pending") + '">DNA results ' + (c.dnaReady ? "ready" : "pending") + '</span>' +
          '<span class="pill ' + (c.healthProfileReady ? "ready" : "pending") + '">Health Profile ' + (c.healthProfileReady ? "ready" : "pending") + '</span>' +
        '</div>' +
      '</div>';
    const action = document.createElement("div");
    if (ready) {
      const btn = document.createElement("button");
      btn.className = "btn-open";
      btn.textContent = "Open in Engine";
      btn.onclick = function () { openInEngine(c.clientId, c.name); };
      action.appendChild(btn);
    } else {
      const span = document.createElement("span");
      span.className = "waiting-note";
      span.textContent = "Waiting on " + (!c.dnaReady && !c.healthProfileReady
        ? "DNA results and Health Profile" : (!c.dnaReady ? "DNA results" : "Health Profile"));
      action.appendChild(span);
    }
    card.appendChild(action);
    list.appendChild(card);
  });
}

function escapeHtml(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function log(msg) {
  const box = document.getElementById("handoff-log");
  box.style.display = "block";
  box.textContent += (box.textContent ? "\n" : "") + msg;
}

async function openInEngine(clientId, name) {
  log("Opening " + name + " (" + clientId + ") in the Engine…");
  let dna, intake;
  try {
    const fullRes = await fetch(API_BASE + "/.netlify/functions/get-client-full-record?clientId=" + encodeURIComponent(clientId), { headers: authHeaders() });
    if (!fullRes.ok) throw new Error("client record not available from server (status " + fullRes.status + ")");
    const full = await fullRes.json();
    if (!full.dnaResults || !full.healthProfile) throw new Error("one or both records not available for this client");
    dna = full.dnaResults;
    intake = full.healthProfile;
  } catch (e) {
    log("FAILED to fetch this client's records: " + e.message);
    alert("Could not load this client's records: " + e.message);
    return;
  }

  const record = {
    pin: "8100",              // same PIN concept as the Engine's own login — see README
    clientCode: clientId,
    dna: dna,
    intake: intake,
    ts: Date.now()
  };
  try {
    window.localStorage.setItem(HANDOFF_KEY, JSON.stringify(record));
  } catch (e) {
    log("FAILED to stage handoff (localStorage unavailable): " + e.message);
    alert("Could not hand this client off to the Engine (localStorage unavailable in this browser/mode).");
    return;
  }
  log("Staged DNA + intake for " + clientId + "; opening Engine tab…");
  window.open(ENGINE_FILE + "?portal=1&client=" + encodeURIComponent(clientId), "_blank");
}
</script>
</body>
</html>
