plugins = []
headers = []

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  external_node_modules = ["@aws-sdk"]
  
# SLA breach checker — runs every 30 minutes
# Detects time-based SLA crossings and patches order_sla rows,
# which fires the Supabase Database Webhook → notify-on-change.js → SMS
[functions.check-sla-breaches]
  schedule = "*/30 * * * *"
  
[functions."*"]

[build]
  publish = "."
  NODE_VERSION = "18"
 

[build.environment]

[build.processing]
  skip_processing = false

[build.processing.css]

[build.processing.html]

[build.processing.images]

[build.processing.js]

[build.services]